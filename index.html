<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vikings Pick a Square</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#09080d;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#0d0b12eF;border-bottom:1px solid #382943;padding:18px 12px;text-align:center}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,44px)} .sub{color:#c9c2cf}
.identity,.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
button{font:inherit} .nav button,.identity button,.btn{border:1px solid #553c63;background:#21172a;color:#fff;border-radius:8px;padding:9px 12px;font-weight:700}
.nav button.active{background:#65358d} main{width:min(980px,100%);margin:auto;padding:18px 12px 50px}
.panel{background:#15111a;border:1px solid #44344c;border-radius:16px;padding:18px}
.meta{color:#c8c0cd} .viewonly{margin:12px 0;padding:12px;border-radius:10px;background:#24192b;text-align:center;font-weight:800}
.scoreboard{margin-top:14px;padding:15px;border-radius:14px;background:#0b0b0e;border:1px solid #493753}
.scoretop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:18px;font-weight:900}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-top:10px}
.team{text-align:center} .team .score{font-size:42px;font-weight:900} .poss{margin-top:8px;text-align:center;font-weight:800}
.squares{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px auto;max-width:720px}
.card{height:145px;border:0;background:transparent;perspective:900px;padding:0} .card:disabled{cursor:default}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s} .card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:14px}
.front{background:linear-gradient(145deg,#7041a0,#4a246d);font-size:52px;font-weight:900}
.back{background:#f5f4f7;color:#111;transform:rotateY(180deg);flex-direction:column;font-size:46px;font-weight:900}
.owner{font-size:15px;color:#4a246d;margin-top:6px} .tag{font-size:12px;margin-bottom:5px;letter-spacing:.05em}
.half .back{outline:5px solid #fff} .final .back{box-shadow:inset 0 0 0 6px #fff} .both .back{outline:5px solid #fff;box-shadow:inset 0 0 0 6px #fff}
.box{margin-top:14px;padding:14px;border-radius:12px;background:#111016;border:1px solid #403247;line-height:1.45}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #29242d} .row:last-child{border-bottom:0}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20} .hidden{display:none}
.dialog{width:min(420px,100%);background:#18141d;border:1px solid #4b3a54;border-radius:16px;padding:20px}
.player{width:100%;margin:5px 0} .small{font-size:13px;color:#aaa3af}
@media(max-width:600px){.card{height:105px} .back{font-size:36px} .owner{font-size:12px}}
</style>
</head>
<body>
<header>
<h1>🏈 Minnesota Vikings Pick a Square</h1>
<div class="sub">Shared live board • 6 paid squares • $30 base pot</div>
<div class="identity">You are: <strong id="who">Not registered</strong><button onclick="openRegistration()">Change player</button></div>
<div class="nav" id="nav"></div>
</header>
<main id="main"></main>

<div class="modal hidden" id="playerModal">
  <div class="dialog">
    <h2>Who are you?</h2>
    <div id="playerButtons"></div>
  </div>
</div>

<script>
const sb=window.supabase.createClient('https://hlgnmfrzdhyvpwrkwiha.supabase.co','sb_publishable_2i9Lyx7QsYmZ_dzhTl7jAA_Wu3IBBnh');
const SCORE_URL='https://hlgnmfrzdhyvpwrkwiha.supabase.co/functions/v1/vikings-score';
const PLAYERS=["Crissy","Cheryl","Cole","Kellen","Lynda","Lynea"];
const PLAYER_KEY="vikings-player-v2";
let currentPlayer=localStorage.getItem(PLAYER_KEY)||null;

const games=[
{phase:"PRE",week:1,date:"Saturday, August 15",time:"12:00 PM CT",opponent:"New York Giants",location:"AWAY",kickoff:"2026-08-15T12:00:00-05:00"},
{phase:"PRE",week:2,date:"Saturday, August 22",time:"12:00 PM CT",opponent:"Baltimore Ravens",location:"HOME",kickoff:"2026-08-22T12:00:00-05:00"},
{phase:"PRE",week:3,date:"Friday, August 28",time:"8:00 PM CT",opponent:"Denver Broncos",location:"AWAY",kickoff:"2026-08-28T20:00:00-05:00"},
{phase:"REG",week:1,date:"Sunday, September 13",time:"3:25 PM CT",opponent:"Green Bay Packers",location:"HOME",kickoff:"2026-09-13T15:25:00-05:00"},
{phase:"REG",week:2,date:"Sunday, September 20",time:"12:00 PM CT",opponent:"Chicago Bears",location:"AWAY",kickoff:"2026-09-20T12:00:00-05:00"},
{phase:"REG",week:3,date:"Sunday, September 27",time:"3:05 PM CT",opponent:"Tampa Bay Buccaneers",location:"AWAY",kickoff:"2026-09-27T15:05:00-05:00"},
{phase:"REG",week:4,date:"Sunday, October 4",time:"3:05 PM CT",opponent:"Miami Dolphins",location:"HOME",kickoff:"2026-10-04T15:05:00-05:00"},
{phase:"REG",week:5,date:"Sunday, October 11",time:"12:00 PM CT",opponent:"New Orleans Saints",location:"AWAY",kickoff:"2026-10-11T12:00:00-05:00"},
{phase:"REG",week:7,date:"Sunday, October 25",time:"12:00 PM CT",opponent:"Indianapolis Colts",location:"HOME",kickoff:"2026-10-25T12:00:00-05:00"},
{phase:"REG",week:8,date:"Sunday, November 1",time:"12:00 PM CT",opponent:"Detroit Lions",location:"AWAY",kickoff:"2026-11-01T12:00:00-06:00"},
{phase:"REG",week:9,date:"Monday, November 9",time:"7:15 PM CT",opponent:"Buffalo Bills",location:"HOME",kickoff:"2026-11-09T19:15:00-06:00"},
{phase:"REG",week:10,date:"Sunday, November 15",time:"12:00 PM CT",opponent:"Green Bay Packers",location:"AWAY",kickoff:"2026-11-15T12:00:00-06:00"},
{phase:"REG",week:11,date:"Sunday, November 22",time:"7:20 PM CT",opponent:"San Francisco 49ers",location:"HOME",kickoff:"2026-11-22T19:20:00-06:00"},
{phase:"REG",week:12,date:"Sunday, November 29",time:"12:00 PM CT",opponent:"Atlanta Falcons",location:"HOME",kickoff:"2026-11-29T12:00:00-06:00"},
{phase:"REG",week:13,date:"Sunday, December 6",time:"3:25 PM CT",opponent:"Carolina Panthers",location:"HOME",kickoff:"2026-12-06T15:25:00-06:00"},
{phase:"REG",week:14,date:"Thursday, December 10",time:"7:15 PM CT",opponent:"New England Patriots",location:"AWAY",kickoff:"2026-12-10T19:15:00-06:00"},
{phase:"REG",week:15,date:"Sunday, December 20",time:"7:20 PM CT",opponent:"Detroit Lions",location:"HOME",kickoff:"2026-12-20T19:20:00-06:00"},
{phase:"REG",week:16,date:"TBD",time:"TBD",opponent:"Washington Commanders",location:"HOME",kickoff:null},
{phase:"REG",week:17,date:"Sunday, January 3, 2027",time:"12:00 PM CT",opponent:"New York Jets",location:"AWAY",kickoff:"2027-01-03T12:00:00-06:00"},
{phase:"REG",week:18,date:"TBD",time:"TBD",opponent:"Chicago Bears",location:"HOME",kickoff:null}
];

let numbers=Array.from({length:games.length},()=>Array(6).fill(null));
let picks=Array.from({length:games.length},()=>[]);
let scores=Array.from({length:games.length},()=>({half:null,final:null}));
let live=Array.from({length:games.length},()=>null);
let active=0;

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function openRegistration(){
  document.getElementById("playerButtons").innerHTML=PLAYERS.map(p=>`<button class="btn player" onclick="choosePlayer('${p}')">${p}</button>`).join("");
  document.getElementById("playerModal").classList.remove("hidden");
}
function choosePlayer(p){currentPlayer=p;localStorage.setItem(PLAYER_KEY,p);document.getElementById("who").textContent=p;document.getElementById("playerModal").classList.add("hidden")}

function unlocked(i){return i===0||Boolean(scores[i-1]?.final)}
function currentIndex(){let i=0;for(let n=0;n<games.length;n++){if(unlocked(n))i=n;else break}return i}
function canPick(i){if(!unlocked(i))return false;const k=games[i].kickoff;if(!k)return true;return Date.now()<new Date(k).getTime()}

function winningNumber(v,o){return ((Math.abs(Number(v))%10)+(Math.abs(Number(o))%10))%10}
function winnerFor(i,period){
  const s=scores[i]?.[period]; if(!s)return null;
  const wn=winningNumber(s.vik,s.opp);
  const p=picks[i].find(x=>Number(numbers[i][x.square_index])===wn);
  return {winningNumber:wn,player:p?.player_name||null,square:p?.square_index??null};
}
function rolloverIn(i,period){
  if(i===0)return 0;
  if(games[i-1].phase==="PRE"&&games[i].phase==="REG")return 0;
  const prevScore=scores[i-1]?.[period]; if(!prevScore)return 0;
  const prevWinner=winnerFor(i-1,period);
  return prevWinner?.player?0:periodPot(i-1,period);
}
function periodPot(i,period){return 30+rolloverIn(i,period)}
function squareClass(i,j){
  const h=winnerFor(i,"half"),f=winnerFor(i,"final");
  const hw=h?.square===j,fw=f?.square===j;
  if(hw&&fw)return ["both","HALF + FINAL"];
  if(hw)return ["half","HALF"];
  if(fw)return ["final","FINAL"];
  return ["",""];
}

function renderNav(){
  document.getElementById("nav").innerHTML=games.map((g,i)=>`<button class="${i===active?"active":""}" onclick="showBoard(${i})">${g.phase==="PRE"?"P":"W"}${g.week}</button>`).join("");
}

function scoreboardHtml(i){
  const g=games[i],k=g.kickoff?new Date(g.kickoff).getTime():null;
  const final=scores[i].final;
  if(final)return `<div class="scoreboard"><div class="scoretop"><span>FINAL</span><span></span></div><div class="teams"><div class="team"><div>Minnesota Vikings</div><div class="score">${final.vik}</div></div><b>VS</b><div class="team"><div>${esc(g.opponent)}</div><div class="score">${final.opp}</div></div></div></div>`;
  if(!k||Date.now()<k)return `<div class="scoreboard"><div class="scoretop"><span>Live Scoreboard</span><span>Game has not started</span></div></div>`;
  const L=live[i];
  if(!L?.found)return `<div class="scoreboard"><div class="scoretop"><span>Live Scoreboard</span><span>Waiting for live data</span></div></div>`;
  return `<div class="scoreboard"><div class="scoretop"><span>${esc(L.status?.periodLabel||"LIVE")}</span><span>${esc(L.status?.displayClock||"")}</span></div><div class="teams"><div class="team"><div>Minnesota Vikings</div><div class="score">${L.vikings?.score??0}</div></div><b>VS</b><div class="team"><div>${esc(L.opponent?.name||g.opponent)}</div><div class="score">${L.opponent?.score??0}</div></div></div><div class="poss">${L.possession?.name?esc(L.possession.name)+" has the ball":"Possession unavailable"}</div></div>`;
}

function outcomeHtml(i,period){
  const s=scores[i][period]; if(!s)return `${period==="half"?"Halftime":"Final"} result not available yet`;
  const w=winnerFor(i,period),pot=periodPot(i,period);
  const math=`${Math.abs(Number(s.vik))%10} + ${Math.abs(Number(s.opp))%10} = ${w.winningNumber}`;
  if(w.player)return `<strong>${esc(w.player)}</strong><br>Winning number: <strong>${w.winningNumber}</strong> (${math})<br>Payout: <strong>$${pot.toFixed(2)}</strong>`;
  return `No winner<br>Winning number: <strong>${w.winningNumber}</strong> (${math})<br>Rollover: <strong>$${pot.toFixed(2)}</strong>`;
}

function render(){
  const g=games[active],viewOnly=!canPick(active);
  const cards=numbers[active].map((num,j)=>{
    const p=picks[active].find(x=>Number(x.square_index)===j);
    const [cls,tag]=squareClass(active,j);
    return `<button class="card ${p?"flipped":""} ${cls}" ${(!canPick(active)||p)?"disabled":""} onclick="pickSquare(${j})"><div class="inner"><div class="face front">?</div><div class="face back">${tag?`<div class="tag">${tag}</div>`:""}<div>${num}</div><div class="owner">${p?esc(p.player_name):""}</div></div></div></button>`;
  }).join("");
  const rows=picks[active].length?picks[active].map(p=>`<div class="row"><span>${esc(p.player_name)}${p.auto_assigned?" (auto)":""}</span><strong>${numbers[active][p.square_index]}</strong></div>`).join(""):`<div class="small">No picks yet.</div>`;
  const half=scores[active].half;
  document.getElementById("main").innerHTML=`<section class="panel">
    <div class="small">${g.phase==="PRE"?"Preseason":"Regular Season"} • Week ${g.week}</div>
    <h2>Vikings ${g.location.includes("AWAY")?"@":"vs."} ${esc(g.opponent)}</h2>
    <div class="meta">${g.date} • ${g.time} • ${g.location}</div>
    ${scoreboardHtml(active)}
    <div class="box"><strong>HALFTIME SCORE</strong><br>${half?`Vikings ${half.vik} — ${esc(g.opponent)} ${half.opp}`:"Not recorded yet"}</div>
    ${!unlocked(active)?`<div class="viewonly">VIEW ONLY — picking opens after the immediately previous game is final.</div>`:""}
    <div class="squares">${cards}</div>
    <div class="box"><strong>Players & Numbers</strong>${rows}</div>
    <div class="box"><strong>🏆 Halftime Winner</strong><br>${outcomeHtml(active,"half")}</div>
    <div class="box"><strong>🏆 Final Winner</strong><br>${outcomeHtml(active,"final")}</div>
    <div class="box"><strong>💵 Pots</strong><br>Base pot: <strong>$30.00</strong><br>Halftime rollover in: <strong>$${rolloverIn(active,"half").toFixed(2)}</strong> • Halftime pot: <strong>$${periodPot(active,"half").toFixed(2)}</strong><br>Final rollover in: <strong>$${rolloverIn(active,"final").toFixed(2)}</strong> • Final pot: <strong>$${periodPot(active,"final").toFixed(2)}</strong>${g.phase==="PRE"?"<br><span class='small'>Preseason rollover resets before Regular Season Week 1.</span>":""}</div>
  </section>`;
}

function showBoard(i){active=i;renderNav();render();if(games[i].kickoff&&Date.now()>=new Date(games[i].kickoff).getTime()&&!scores[i].final)syncGame(i)}

async function loadAll(){
  const [n,p,r]=await Promise.all([
    sb.from("board_numbers").select("*").order("game_index").order("square_index"),
    sb.from("board_picks").select("*").order("created_at"),
    sb.from("board_game_results").select("*").order("game_index")
  ]);
  if(n.error)throw n.error;if(p.error)throw p.error;if(r.error)throw r.error;
  numbers=Array.from({length:games.length},()=>Array(6).fill(null));
  for(const x of n.data||[])numbers[x.game_index][x.square_index]=Number(x.number);
  picks=Array.from({length:games.length},()=>[]);
  for(const x of p.data||[])picks[x.game_index].push(x);
  scores=Array.from({length:games.length},()=>({half:null,final:null}));
  for(const x of r.data||[])scores[x.game_index]={half:x.half_result||null,final:x.final_result||null};
}

async function pickSquare(j){
  if(!unlocked(active)){alert("This week is view-only until the previous game is final.");return}
  if(!canPick(active)){alert("Picking is closed for this game.");return}
  if(!currentPlayer){openRegistration();return}
  if(picks[active].some(p=>p.player_name===currentPlayer)){alert(`${currentPlayer} already has a square for this game.`);return}
  const number=numbers[active][j];
  const {error}=await sb.from("board_picks").insert({game_index:active,square_index:j,player_name:currentPlayer,number,auto_assigned:false});
  if(error){await refresh(false);alert("That square or player was just claimed.");return}
  await refresh(false);
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
async function autoAssign(i){
  const k=games[i].kickoff;if(!k||Date.now()<new Date(k).getTime()||!unlocked(i))return;
  await loadAll();
  const usedNames=new Set(picks[i].map(p=>p.player_name)),usedSquares=new Set(picks[i].map(p=>Number(p.square_index)));
  const missing=PLAYERS.filter(p=>!usedNames.has(p)),open=shuffle([0,1,2,3,4,5].filter(j=>!usedSquares.has(j)));
  for(let x=0;x<missing.length&&x<open.length;x++)await sb.from("board_picks").insert({game_index:i,square_index:open[x],player_name:missing[x],number:numbers[i][open[x]],auto_assigned:true});
  await refresh(false);
}

function scoreDate(g){if(!g.kickoff)return null;const d=new Date(g.kickoff);return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`}
async function saveScore(i,period,v,o){
  const payload={game_index:i,updated_at:new Date().toISOString()};
  if(period==="half")payload.half_result={vik:Number(v),opp:Number(o)};
  else{payload.final_result={vik:Number(v),opp:Number(o)};payload.completed_at=new Date().toISOString()}
  const {error}=await sb.from("board_game_results").upsert(payload,{onConflict:"game_index"});
  if(error)console.warn("save score",error);
}
async function syncGame(i){
  const g=games[i],d=scoreDate(g);if(!d||!g.kickoff||Date.now()<new Date(g.kickoff).getTime())return;
  try{
    const r=await fetch(`${SCORE_URL}?date=${d}&opponent=${encodeURIComponent(g.opponent)}`,{cache:"no-store"});
    if(!r.ok)return;const data=await r.json();if(!data?.found)return;
    const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
    if(norm(data.opponent?.name)!==norm(g.opponent))return;
    live[i]={...data,gameIndex:i};
    if(data.vikings?.halftime!=null&&data.opponent?.halftime!=null&&!scores[i].half)await saveScore(i,"half",data.vikings.halftime,data.opponent.halftime);
    if(data.final?.vikings!=null&&data.final?.opponent!=null&&!scores[i].final)await saveScore(i,"final",data.final.vikings,data.final.opponent);
    if(i===active)render();
  }catch(e){console.warn(e)}
}
async function syncRelevant(){
  const now=Date.now();
  for(let i=0;i<games.length;i++){const k=games[i].kickoff;if(k&&now>=new Date(k).getTime()&&(!scores[i].half||!scores[i].final))syncGame(i)}
}
async function refresh(jumpToCurrent=false){const viewed=active;await loadAll();active=jumpToCurrent?currentIndex():viewed;renderNav();render()}

function subscribe(){
  sb.channel("vikings-clean-live")
   .on("postgres_changes",{event:"*",schema:"public",table:"board_picks"},()=>refresh(false))
   .on("postgres_changes",{event:"*",schema:"public",table:"board_game_results"},()=>refresh(false))
   .subscribe();
}

async function init(){
  document.getElementById("who").textContent=currentPlayer||"Not registered";
  if(!currentPlayer)setTimeout(openRegistration,250);
  try{
    await loadAll();
    active=currentIndex();
    renderNav();render();subscribe();
    for(let i=0;i<games.length;i++)await autoAssign(i);
    await syncRelevant();
    setInterval(syncRelevant,20000);
  }catch(e){
    document.getElementById("main").innerHTML=`<div class="box"><strong>Board could not load.</strong><br>${esc(e.message||e)}</div>`;
  }
}
init();
</script>
</body>
</html>
