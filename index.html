<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minnesota Vikings Pick a Square</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#2a1640 0%,#0c0b11 48%,#050608 100%);
  color:#fff;
}
header {
  text-align:center; padding:24px 14px 16px; position:sticky; top:0; z-index:10;
  background:rgba(7,7,10,.95); border-bottom:1px solid #33243e;
}
h1 { margin:0 0 6px; font-size:clamp(28px,6vw,46px); }
.subtitle { color:#c7bfce; margin:0; }
.identity { margin-top:10px; display:flex; justify-content:center; gap:8px; align-items:center; flex-wrap:wrap; }
.identity button,.nav button,.control {
  border:1px solid #4a3655; background:#201629; color:#fff; border-radius:8px;
  padding:9px 12px; font-weight:700; cursor:pointer;
}
.nav { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
.nav button.active { background:#673596; }
.nav button:disabled { opacity:.35; cursor:not-allowed; }
main { width:min(980px,100%); margin:0 auto; padding:20px 12px 40px; }
.board {
  display:none; background:linear-gradient(145deg,rgba(26,19,34,.97),rgba(12,12,17,.98));
  border:1px solid #4a3b52; border-radius:18px; padding:20px;
}
.board.active { display:block; }
.game-number { color:#ad7bc9; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:13px; }
.game-title { margin:5px 0 4px; font-size:clamp(23px,5vw,34px); }
.game-meta { color:#c9c2ce; margin-bottom:10px; }
.score-summary,.winner-note,.payout-box,.results,.lock-note {
  margin-top:12px; padding:13px 15px; border-radius:12px; background:#111016; border:1px solid #403247;
}
.lock-note { text-align:center; background:#17121d; }
.squares { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:720px; margin:18px auto; }
.card { height:150px; border:0; background:transparent; perspective:900px; padding:0; cursor:pointer; }
.card:disabled { cursor:default; }
.card-inner { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .55s; }
.card.flipped .card-inner { transform:rotateY(180deg); }
.face {
  position:absolute; inset:0; border-radius:14px; display:flex; align-items:center; justify-content:center;
  backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 10px 28px rgba(0,0,0,.35);
}
.front { background:linear-gradient(145deg,#7041a0,#4a246d); font-size:54px; font-weight:900; }
.back {
  background:#f7f7f9; color:#111; transform:rotateY(180deg); font-size:48px; font-weight:900;
  flex-direction:column; gap:7px;
}
.owner { font-size:16px; color:#4a246d; font-weight:900; }
.winner-tag { font-size:12px; font-weight:900; letter-spacing:.05em; }
.winner-half .back { outline:4px solid #999; }
.winner-final .back { box-shadow:inset 0 0 0 5px #666,0 10px 28px rgba(0,0,0,.35); }
.winner-both .back { outline:4px solid #999; box-shadow:inset 0 0 0 5px #666,0 10px 28px rgba(0,0,0,.35); }
.status { text-align:center; color:#c8c1ce; min-height:23px; }
.result-row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid #28232c; }
.result-row:last-child { border-bottom:0; }
.score-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; }
input {
  width:100%; padding:12px; border-radius:8px; border:1px solid #51475a; background:#0d0c10; color:#fff;
}
.modal {
  position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:center; justify-content:center;
  padding:18px; z-index:30;
}
.modal.hidden { display:none; }
.dialog { width:min(430px,100%); background:#19151e; border:1px solid #4a3a52; border-radius:16px; padding:22px; }
.player-btn { width:100%; margin:5px 0; }
.small { color:#aaa2b0; font-size:13px; }
@media(max-width:600px) {
  .card { height:105px; }
  .back { font-size:38px; }
  .owner { font-size:13px; }
  .squares { gap:8px; }
}
</style>
</head>
<body>
<header>
  <h1>🏈 Minnesota Vikings Pick a Square</h1>
  <p class="subtitle">Shared live board • 6 paid squares per game • $30 base pot per board</p>
  <div class="identity">You are: <strong id="who">Not registered</strong>
    <button onclick="openRegistration()">Change player</button>
  </div>
  <div class="nav" id="nav"></div>
</header>

<main id="main"></main>

<div class="modal hidden" id="playerModal">
  <div class="dialog">
    <h2>Who are you?</h2>
    <p>Choose your name. This device will remember it.</p>
    <div id="playerButtons"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://hlgnmfrzdhyvpwrkwiha.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2i9Lyx7QsYmZ_dzhTl7jAA_Wu3IBBnh';
const SCORE_URL = 'https://hlgnmfrzdhyvpwrkwiha.supabase.co/functions/v1/vikings-score';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PLAYERS = ["Crissy","Cheryl","Cole","Kellen","Lynda","Lynea"];
const PLAYER_KEY = "vikings-player";
let currentPlayer = localStorage.getItem(PLAYER_KEY) || null;

const games = [
  {phase:"PRE",week:1,date:"Saturday, August 15",time:"12:00 PM CT",opponent:"New York Giants",location:"AWAY",kickoff:"2026-08-15T12:00:00-05:00"},
  {phase:"PRE",week:2,date:"Saturday, August 22",time:"12:00 PM CT",opponent:"Baltimore Ravens",location:"HOME",kickoff:"2026-08-22T12:00:00-05:00"},
  {phase:"PRE",week:3,date:"Friday, August 28",time:"8:00 PM CT",opponent:"Denver Broncos",location:"AWAY",kickoff:"2026-08-28T20:00:00-05:00"},
  {phase:"REG",week:1,date:"Sunday, September 13",time:"3:25 PM CT",opponent:"Green Bay Packers",location:"HOME",kickoff:"2026-09-13T15:25:00-05:00"},
  {phase:"REG",week:2,date:"Sunday, September 20",time:"12:00 PM CT",opponent:"Chicago Bears",location:"AWAY",kickoff:"2026-09-20T12:00:00-05:00"},
  {phase:"REG",week:3,date:"Sunday, September 27",time:"3:05 PM CT",opponent:"Tampa Bay Buccaneers",location:"AWAY",kickoff:"2026-09-27T15:05:00-05:00"},
  {phase:"REG",week:4,date:"Sunday, October 4",time:"3:05 PM CT",opponent:"Miami Dolphins",location:"HOME",kickoff:"2026-10-04T15:05:00-05:00"},
  {phase:"REG",week:5,date:"Sunday, October 11",time:"12:00 PM CT",opponent:"New Orleans Saints",location:"AWAY",kickoff:"2026-10-11T12:00:00-05:00"},
  {phase:"REG",week:7,date:"Sunday, October 25",time:"12:00 PM CT",opponent:"Indianapolis Colts",location:"HOME",kickoff:"2026-10-25T12:00:00-05:00"},
  {phase:"REG",week:8,date:"Sunday, November 1",time:"12:00 PM CT",opponent:"Detroit Lions",location:"AWAY",kickoff:"2026-11-01T12:00:00-06:00"},
  {phase:"REG",week:9,date:"Monday, November 9",time:"7:15 PM CT",opponent:"Buffalo Bills",location:"HOME",kickoff:"2026-11-09T19:15:00-06:00"},
  {phase:"REG",week:10,date:"Sunday, November 15",time:"12:00 PM CT",opponent:"Green Bay Packers",location:"AWAY",kickoff:"2026-11-15T12:00:00-06:00"},
  {phase:"REG",week:11,date:"Sunday, November 22",time:"7:20 PM CT",opponent:"San Francisco 49ers",location:"HOME • MEXICO CITY",kickoff:"2026-11-22T19:20:00-06:00"},
  {phase:"REG",week:12,date:"Sunday, November 29",time:"12:00 PM CT",opponent:"Atlanta Falcons",location:"HOME",kickoff:"2026-11-29T12:00:00-06:00"},
  {phase:"REG",week:13,date:"Sunday, December 6",time:"3:25 PM CT",opponent:"Carolina Panthers",location:"HOME",kickoff:"2026-12-06T15:25:00-06:00"},
  {phase:"REG",week:14,date:"Thursday, December 10",time:"7:15 PM CT",opponent:"New England Patriots",location:"AWAY",kickoff:"2026-12-10T19:15:00-06:00"},
  {phase:"REG",week:15,date:"Sunday, December 20",time:"7:20 PM CT",opponent:"Detroit Lions",location:"HOME",kickoff:"2026-12-20T19:20:00-06:00"},
  {phase:"REG",week:16,date:"TBD",time:"TBD",opponent:"Washington Commanders",location:"HOME",kickoff:null},
  {phase:"REG",week:17,date:"Sunday, January 3, 2027",time:"12:00 PM CT",opponent:"New York Jets",location:"AWAY",kickoff:"2027-01-03T12:00:00-06:00"},
  {phase:"REG",week:18,date:"TBD",time:"TBD",opponent:"Chicago Bears",location:"HOME",kickoff:null}
];

let numbers = Array.from({length:games.length},()=>Array(6).fill(null));
let picks = Array.from({length:games.length},()=>[]);
let results = Array.from({length:games.length},()=>({half:null,final:null,completedAt:null}));
let active = 0;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function openRegistration() {
  document.getElementById("playerButtons").innerHTML = PLAYERS.map(p =>
    `<button class="control player-btn" onclick="choosePlayer('${p}')">${p}</button>`
  ).join("");
  document.getElementById("playerModal").classList.remove("hidden");
}

function choosePlayer(name) {
  if (!PLAYERS.includes(name)) return;
  currentPlayer = name;
  localStorage.setItem(PLAYER_KEY,name);
  document.getElementById("who").textContent = name;
  document.getElementById("playerModal").classList.add("hidden");
}

function unlocked(i) {
  if (i === 0) return true;
  return !!results[i - 1].final;
}

function currentIndex() {
  let idx=0;
  for (let i=0;i<games.length;i++) if (unlocked(i)) idx=i;
  return idx;
}

function basePot(i) { return 30; }
function halfRollIn(i) { return i>0 && results[i-1].half ? Number(results[i-1].half.rolloverOut||0) : 0; }
function finalRollIn(i) { return i>0 && results[i-1].final ? Number(results[i-1].final.rolloverOut||0) : 0; }
function periodPot(i,period) { return basePot(i)+(period==="half"?halfRollIn(i):finalRollIn(i)); }

function winnerStatus(i,square) {
  const p = picks[i].find(x=>x.square_index===square);
  if (!p) return {cls:"",tag:""};
  const h = results[i].half && Number(p.number)===Number(results[i].half.winningNumber);
  const f = results[i].final && Number(p.number)===Number(results[i].final.winningNumber);
  if (h&&f) return {cls:"winner-both",tag:"HALF + FINAL"};
  if (h) return {cls:"winner-half",tag:"HALF"};
  if (f) return {cls:"winner-final",tag:"FINAL"};
  return {cls:"",tag:""};
}

function renderNav() {
  const nav=document.getElementById("nav");
  nav.innerHTML=games.map((g,i)=>{
    const label=(g.phase==="PRE"?"P":"W")+g.week;
    return `<button class="${i===active?"active":""}" ${unlocked(i)?"":"disabled"} onclick="showBoard(${i})">${label}</button>`;
  }).join("");
}

function render() {
  const g=games[active];
  const canUse=unlocked(active);
  const half=results[active].half;
  const final=results[active].final;
  const scoreHtml = final
    ? `<strong>HALFTIME:</strong> ${half?`Vikings ${half.vik} — ${g.opponent} ${half.opp}`:"Not recorded"}<br><strong>FINAL:</strong> Vikings ${final.vik} — ${g.opponent} ${final.opp}`
    : half
      ? `<strong>HALFTIME:</strong> Vikings ${half.vik} — ${g.opponent} ${half.opp}<br><strong>FINAL:</strong> Game not final`
      : `<strong>Scores:</strong> waiting for game data`;

  const cards=numbers[active].map((num,j)=>{
    const p=picks[active].find(x=>x.square_index===j);
    const w=winnerStatus(active,j);
    return `<button class="card ${p?"flipped":""} ${w.cls}" ${(p||!canUse)?"disabled":""} onclick="pickSquare(${j})">
      <div class="card-inner">
        <div class="face front">?</div>
        <div class="face back">
          ${w.tag?`<div class="winner-tag">${w.tag}</div>`:""}
          <div>${num ?? "-"}</div>
          <div class="owner">${p?escapeHtml(p.player_name):""}</div>
        </div>
      </div>
    </button>`;
  }).join("");

  const rows=picks[active].length
    ? picks[active].map(p=>`<div class="result-row"><span>${escapeHtml(p.player_name)}${p.auto_assigned?" (auto-assigned)":""}</span><strong>${p.number}</strong></div>`).join("")
    : `<div class="small">No picks yet.</div>`;

  const lockHtml=canUse?"":`<div class="lock-note"><strong>🔒 Board Locked</strong><br>This board opens only after the previous game is final.</div>`;

  const halfWinner = half
    ? (half.winners?.length ? `${half.winners.map(escapeHtml).join(", ")} — $${Number(half.payoutEach).toFixed(2)}` : `No winner — $${Number(half.rolloverOut).toFixed(2)} rolls to next halftime pot`)
    : "Not calculated yet";
  const finalWinner = final
    ? (final.winners?.length ? `${final.winners.map(escapeHtml).join(", ")} — $${Number(final.payoutEach).toFixed(2)}` : `No winner — $${Number(final.rolloverOut).toFixed(2)} rolls to next final pot`)
    : "Not calculated yet";

  document.getElementById("main").innerHTML=`
    <section class="board active">
      <div class="game-number">${g.phase==="PRE"?"Preseason":"Regular Season"} • Week ${g.week}</div>
      <h2 class="game-title">Vikings ${g.location.includes("AWAY")?"@":"vs."} ${g.opponent}</h2>
      <div class="game-meta"><strong>${g.date}</strong> • <strong>${g.time}</strong> • ${g.location}</div>
      <div class="score-summary">${scoreHtml}</div>
      ${lockHtml}
      <div class="squares">${cards}</div>
      <div class="status">${6-picks[active].length} square${6-picks[active].length===1?"":"s"} available</div>
      <div class="results"><h3>Players & Numbers</h3>${rows}</div>

      <div class="winner-note">
        <strong>🏆 Winner Rule</strong><br>
        Add the last digit of each team's score. Use the last digit of that total as the winning number.
      </div>

      <div class="payout-box">
        <strong>💵 Payouts</strong><br>
        All 6 squares are paid at $5 each, whether manually chosen or auto-assigned.<br>
        Base pot: <strong>$${basePot(active).toFixed(2)}</strong><br>
        Halftime rollover in: <strong>$${halfRollIn(active).toFixed(2)}</strong> • Halftime pot: <strong>$${periodPot(active,"half").toFixed(2)}</strong><br>
        Final rollover in: <strong>$${finalRollIn(active).toFixed(2)}</strong> • Final pot: <strong>$${periodPot(active,"final").toFixed(2)}</strong><br><br>
        <strong>Halftime winner:</strong> ${halfWinner}<br>
        <strong>Final winner:</strong> ${finalWinner}
      </div>
    </section>`;
}

function showBoard(i) {
  if (!unlocked(i)) return;
  active=i;
  renderNav();
  render();
}

async function loadAll() {
  const [n,p,r] = await Promise.all([
    sb.from("board_numbers").select("*").order("game_index").order("square_index"),
    sb.from("board_picks").select("*").order("created_at"),
    sb.from("board_game_results").select("*").order("game_index")
  ]);

  if (n.error) throw n.error;
  if (p.error) throw p.error;
  if (r.error) throw r.error;

  numbers=Array.from({length:games.length},()=>Array(6).fill(null));
  for (const row of n.data||[]) numbers[row.game_index][row.square_index]=Number(row.number);

  picks=Array.from({length:games.length},()=>[]);
  for (const row of p.data||[]) picks[row.game_index].push(row);

  results=Array.from({length:games.length},()=>({half:null,final:null,completedAt:null}));
  for (const row of r.data||[]) {
    results[row.game_index]={
      half:row.half_result||null,
      final:row.final_result||null,
      completedAt:row.completed_at||row.final_result?.completedAt||null
    };
  }
}

async function pickSquare(square) {
  if (!currentPlayer) { openRegistration(); return; }
  if (!unlocked(active)) return;
  const g=games[active];
  if (g.kickoff && Date.now()>=new Date(g.kickoff).getTime()) {
    await autoAssign(active);
    return;
  }
  if (picks[active].some(p=>p.player_name===currentPlayer)) {
    alert(`${currentPlayer} already has a square for this game.`);
    return;
  }
  if (picks[active].some(p=>p.square_index===square)) return;

  const number=numbers[active][square];
  const {error}=await sb.from("board_picks").insert({
    game_index:active,square_index:square,player_name:currentPlayer,number,auto_assigned:false
  });
  if (error) {
    await refresh();
    alert("That square or player was just claimed by someone else.");
    return;
  }
  await refresh();
}

async function autoAssign(i) {
  const g=games[i];
  if (!g.kickoff || Date.now()<new Date(g.kickoff).getTime()) return;

  await loadAll();
  const usedNames=new Set(picks[i].map(p=>p.player_name));
  const usedSquares=new Set(picks[i].map(p=>p.square_index));
  const missing=PLAYERS.filter(p=>!usedNames.has(p));
  const open=[0,1,2,3,4,5].filter(s=>!usedSquares.has(s));

  for (let k=0;k<missing.length && k<open.length;k++) {
    await sb.from("board_picks").insert({
      game_index:i,square_index:open[k],player_name:missing[k],number:numbers[i][open[k]],auto_assigned:true
    });
  }
  await refresh();
}

function winningNumber(v,o) { return ((Math.abs(Number(v))%10)+(Math.abs(Number(o))%10))%10; }

async function saveResult(i,period,v,o) {
  const wn=winningNumber(v,o);
  const winners=picks[i].filter(p=>Number(p.number)===wn).map(p=>p.player_name);
  const pot=periodPot(i,period);
  const result={
    vik:Number(v),opp:Number(o),winningNumber:wn,winners,
    payoutEach:winners.length?pot/winners.length:0,
    pot,rolloverOut:winners.length?0:pot
  };
  const payload={game_index:i,updated_at:new Date().toISOString()};
  if (period==="half") payload.half_result=result;
  else {
    result.completedAt=new Date().toISOString();
    payload.final_result=result;
    payload.completed_at=result.completedAt;
  }
  const {error}=await sb.from("board_game_results").upsert(payload,{onConflict:"game_index"});
  if (error) console.warn(error);
  await refresh();
}

function scoreDate(g) {
  if (!g.kickoff) return null;
  const d=new Date(g.kickoff);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
}

async function syncScore(i) {
  const g=games[i], d=scoreDate(g);
  if (!d) return;
  try {
    const res=await fetch(`${SCORE_URL}?date=${d}&opponent=${encodeURIComponent(g.opponent)}`);
    if (!res.ok) return;
    const data=await res.json();
    if (!data.found) return;
    if (data.vikings?.halftime!=null && data.opponent?.halftime!=null && !results[i].half)
      await saveResult(i,"half",data.vikings.halftime,data.opponent.halftime);
    if (data.final?.vikings!=null && data.final?.opponent!=null && !results[i].final)
      await saveResult(i,"final",data.final.vikings,data.final.opponent);
  } catch(e) { console.warn("score sync",e); }
}

async function refresh() {
  await loadAll();
  active=currentIndex();
  renderNav();
  render();
}

function subscribe() {
  sb.channel("vikings-live")
    .on("postgres_changes",{event:"*",schema:"public",table:"board_picks"},refresh)
    .on("postgres_changes",{event:"*",schema:"public",table:"board_game_results"},refresh)
    .subscribe();
}

async function init() {
  document.getElementById("who").textContent=currentPlayer||"Not registered";
  if (!currentPlayer) setTimeout(openRegistration,250);
  try {
    await loadAll();
    active=currentIndex();
    renderNav();
    render();
    subscribe();
    await autoAssign(active);
    await syncScore(active);
    setInterval(()=>syncScore(active),60000);
  } catch(e) {
    console.error(e);
    document.getElementById("main").innerHTML=`<div class="lock-note"><strong>Board could not load.</strong><br>${escapeHtml(e.message||e)}</div>`;
  }
}
init();
</script>
</body>
</html>
