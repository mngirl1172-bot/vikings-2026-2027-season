<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minnesota Vikings Pick a Square</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #2a1640 0%, #0c0b11 48%, #050608 100%);
    color: #fff;
  }
  header {
    text-align: center;
    padding: 28px 16px 20px;
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(7,7,10,.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #33243e;
  }
  h1 { margin: 0 0 7px; font-size: clamp(30px, 6vw, 48px); }
  .subtitle { color: #c7bfce; margin: 0; }
  .nav {
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
    margin-top:18px;
  }
  .nav button {
    border:1px solid #493652; background:#17121d; color:#ddd2e5;
    border-radius:8px; padding:8px 11px; cursor:pointer; font-weight:700;
  }
  .nav button.active { background:#5b2b82; color:#fff; border-color:#7d45a8; }

  main { width:min(980px, 100%); margin:0 auto; padding:25px 14px 50px; }
  .board {
    display:none;
    background:linear-gradient(145deg, rgba(26,19,34,.97), rgba(12,12,17,.98));
    border:1px solid #4a3b52;
    border-radius:18px;
    padding:22px;
    margin-bottom:25px;
    box-shadow:0 18px 55px rgba(0,0,0,.35);
  }
  .board.active { display:block; }
  .game-number { color:#ad7bc9; font-weight:800; letter-spacing:.08em; text-transform:uppercase; font-size:13px; }
  .game-title { margin:5px 0 4px; font-size:clamp(23px, 5vw, 34px); }
  .game-meta { color:#c9c2ce; margin-bottom:20px; font-size:16px; }
  .game-meta strong { color:#fff; }

  .squares {
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:13px;
    max-width:720px;
    margin:0 auto 20px;
  }
  .card {
    height:155px;
    border:0;
    background:transparent;
    perspective:900px;
    cursor:pointer;
    padding:0;
  }
  .card:disabled { cursor:default; }
  .card-inner {
    position:relative; width:100%; height:100%;
    transition:transform .65s cubic-bezier(.2,.75,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner { transform:rotateY(180deg); }
  .face {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    border-radius:14px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.35);
  }
  .front {
    background:linear-gradient(145deg,#7041a0,#4a246d);
    border:1px solid rgba(255,255,255,.18);
    font-size:58px; font-weight:800;
  }
  .back {
    background:#f7f7f9; color:#111;
    transform:rotateY(180deg); font-size:70px; font-weight:900;
    border:2px solid #fff;
  }
  .status { text-align:center; color:#c8c1ce; min-height:23px; }
  .results {
    background:#111016; border:1px solid #352c3b; border-radius:12px;
    padding:13px 15px; margin-top:15px;
  }
  .results h3 { margin:0 0 8px; font-size:16px; }
  .result-row {
    display:flex; justify-content:space-between; gap:12px;
    padding:8px 0; border-bottom:1px solid #28232c;
  }
  .result-row:last-child { border-bottom:0; }
  .empty { color:#77717e; font-size:14px; }

  .bottom-controls { text-align:center; margin-top:24px; }
  .control {
    border:0; border-radius:9px; padding:12px 18px; background:#673596;
    color:#fff; font-weight:800; cursor:pointer; margin:4px;
  }
  .control.secondary { background:#211b27; border:1px solid #403747; }

  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.78);
    display:flex; align-items:center; justify-content:center;
    padding:18px; z-index:20;
  }
  .modal.hidden { display:none; }
  .dialog {
    width:min(450px,100%); background:#19151e; border:1px solid #4a3a52;
    border-radius:16px; padding:24px; box-shadow:0 25px 75px rgba(0,0,0,.6);
  }
  .dialog h2 { margin:0 0 7px; }
  .dialog p { color:#c0b9c5; margin:0 0 17px; }
  .close { float:right; border:0; background:none; color:#aaa2b0; font-size:26px; cursor:pointer; }
  input {
    width:100%; padding:14px; border-radius:9px; border:1px solid #51475a;
    background:#0d0c10; color:#fff; font-size:16px; outline:none;
  }
  input:focus { border-color:#8b53b5; }
  .submit { width:100%; margin:12px 0 0; }

  .footer-note { text-align:center; color:#746c78; font-size:13px; margin-top:20px; }

  @media (max-width:600px) {
    main { padding-left:9px; padding-right:9px; }
    .board { padding:14px; }
    .card { height:105px; }
    .front { font-size:43px; }
    .back { font-size:53px; }
    .squares { gap:8px; }
    .nav { max-height:92px; overflow:auto; justify-content:flex-start; }
  }
</style>
</head>
<body>

<header>
  <h1>🏈 Minnesota Vikings Pick a Square!</h1>
  <p class="subtitle">Pick a square for each 2026 Vikings regular-season game.</p>
  <div class="nav" id="nav"></div>
</header>

<main id="boards"></main>

<div class="bottom-controls">
  <button class="control secondary" onclick="newAllBoards()">🎲 New Numbers for All Games</button>
  <button class="control secondary" onclick="clearAllPicks()">Clear All Names</button>
</div>
<p class="footer-note">
  Schedule information is based on the current Vikings schedule. Games marked TBD have not yet been assigned a date/time.
</p>

<div class="modal hidden" id="modal">
  <div class="dialog">
    <button class="close" onclick="closeModal()">×</button>
    <h2>Enter Your Name</h2>
    <p id="modalGame"></p>
    <input id="nameInput" type="text" maxlength="40" placeholder="Your name" autocomplete="name">
    <button class="control submit" onclick="submitPick()">Reveal My Number</button>
  </div>
</div>

<script>
const games = [
  {week:1, date:"Sunday, September 13", time:"3:25 PM CT", opponent:"Green Bay Packers", location:"HOME"},
  {week:2, date:"Sunday, September 20", time:"12:00 PM CT", opponent:"Chicago Bears", location:"AWAY"},
  {week:3, date:"Sunday, September 27", time:"3:05 PM CT", opponent:"Tampa Bay Buccaneers", location:"AWAY"},
  {week:4, date:"Sunday, October 4", time:"3:05 PM CT", opponent:"Miami Dolphins", location:"HOME"},
  {week:5, date:"Sunday, October 11", time:"12:00 PM CT", opponent:"New Orleans Saints", location:"AWAY"},
  {week:7, date:"Sunday, October 25", time:"12:00 PM CT", opponent:"Indianapolis Colts", location:"HOME"},
  {week:8, date:"Sunday, November 1", time:"12:00 PM CT", opponent:"Detroit Lions", location:"AWAY"},
  {week:9, date:"Monday, November 9", time:"7:15 PM CT", opponent:"Buffalo Bills", location:"HOME"},
  {week:10, date:"Sunday, November 15", time:"12:00 PM CT", opponent:"Green Bay Packers", location:"AWAY"},
  {week:11, date:"Sunday, November 22", time:"7:20 PM CT", opponent:"San Francisco 49ers", location:"HOME • MEXICO CITY"},
  {week:12, date:"Sunday, November 29", time:"12:00 PM CT", opponent:"Atlanta Falcons", location:"HOME"},
  {week:13, date:"Sunday, December 6", time:"3:25 PM CT", opponent:"Carolina Panthers", location:"HOME"},
  {week:14, date:"Thursday, December 10", time:"7:15 PM CT", opponent:"New England Patriots", location:"AWAY"},
  {week:15, date:"Sunday, December 20", time:"7:20 PM CT", opponent:"Detroit Lions", location:"HOME"},
  {week:16, date:"TBD", time:"TBD", opponent:"Washington Commanders", location:"HOME"},
  {week:17, date:"Sunday, January 3, 2027", time:"12:00 PM CT", opponent:"New York Jets", location:"AWAY"},
  {week:18, date:"TBD", time:"TBD", opponent:"Chicago Bears", location:"HOME"}
];

let state = games.map(() => ({
  numbers: randomNumbers(),
  picked: Array(6).fill(false),
  players: []
}));
let selected = null;
let activeBoard = 0;

function randomNumbers() {
  return Array.from({length:6}, () => Math.floor(Math.random() * 10));
}

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = games.map((g,i) =>
    `<button class="${i===activeBoard?'active':''}" onclick="showBoard(${i})">W${g.week}</button>`
  ).join('');
}

function buildBoards() {
  const boards = document.getElementById('boards');
  boards.innerHTML = games.map((g,i) => `
    <section class="board ${i===activeBoard?'active':''}" id="board-${i}">
      <div class="game-number">Game ${i+1} • Week ${g.week}</div>
      <h2 class="game-title">Vikings ${g.location.includes('AWAY') ? '@' : 'vs.'} ${g.opponent}</h2>
      <div class="game-meta">
        <strong>${g.date}</strong> &nbsp;•&nbsp; <strong>${g.time}</strong>
        &nbsp;•&nbsp; ${g.location}
      </div>
      <div class="squares" id="squares-${i}"></div>
      <div class="status" id="status-${i}"></div>
      <div class="results">
        <h3>Players & Numbers</h3>
        <div id="results-${i}"></div>
      </div>
    </section>
  `).join('');

  games.forEach((_,i) => renderBoard(i));
}

function renderBoard(i) {
  const squares = document.getElementById(`squares-${i}`);
  const s = state[i];
  squares.innerHTML = s.numbers.map((num,j) => `
    <button class="card ${s.picked[j]?'flipped':''}" ${s.picked[j]?'disabled':''}
      onclick="openModal(${i},${j})" aria-label="Square ${j+1}">
      <div class="card-inner">
        <div class="face front">?</div>
        <div class="face back">${num}</div>
      </div>
    </button>
  `).join('');

  const remaining = s.picked.filter(x=>!x).length;
  document.getElementById(`status-${i}`).textContent =
    remaining ? `${remaining} square${remaining===1?'':'s'} available` : 'All 6 squares have been picked!';

  const result = document.getElementById(`results-${i}`);
  result.innerHTML = s.players.length
    ? s.players.map(p => `<div class="result-row"><span>${escapeHtml(p.name)}</span><strong>${p.number}</strong></div>`).join('')
    : '<div class="empty">No picks yet.</div>';
}

function showBoard(i) {
  activeBoard = i;
  document.querySelectorAll('.board').forEach((b,n)=>b.classList.toggle('active',n===i));
  buildNav();
  window.scrollTo({top:0, behavior:'smooth'});
}

function openModal(gameIndex, squareIndex) {
  if (state[gameIndex].picked[squareIndex]) return;
  selected = {gameIndex, squareIndex};
  document.getElementById('modalGame').textContent =
    `Week ${games[gameIndex].week}: Vikings ${games[gameIndex].location.includes('AWAY')?'@':'vs.'} ${games[gameIndex].opponent}`;
  document.getElementById('nameInput').value = '';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('nameInput').focus(),50);
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  selected = null;
}

function submitPick() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name || !selected) return;
  const {gameIndex, squareIndex} = selected;
  const s = state[gameIndex];
  if (s.picked[squareIndex]) return;

  s.picked[squareIndex] = true;
  s.players.push({name, number:s.numbers[squareIndex]});
  closeModal();
  renderBoard(gameIndex);

  // Automatically advance to the next game after a pick.
  if (gameIndex < games.length-1) {
    showBoard(gameIndex+1);
  }
}

document.getElementById('nameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPick();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});

function newAllBoards() {
  state = games.map(() => ({
    numbers: randomNumbers(),
    picked: Array(6).fill(false),
    players: []
  }));
  buildBoards();
}

function clearAllPicks() {
  state.forEach(s => {
    s.picked = Array(6).fill(false);
    s.players = [];
  });
  games.forEach((_,i)=>renderBoard(i));
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;'
  }[c]));
}

buildNav();
buildBoards();
</script>
</body>
</html>
